openapi: 3.0.3
info:
  title: Video Manager API
  description: |
    API REST para gestión de videos y categorías con soporte para subcategorías recursivas.

    ## Características
    - CRUD de categorías y subcategorías
    - CRUD de videos con upload de archivos
    - Validación de categorías sin duplicados (case-insensitive)
    - Los nombres de categorías se normalizan a minúsculas
    - Búsqueda de videos por título, categoría o subcategoría
    - Los videos se sirven como URLs públicas (assets/backend/videos)
    - Las miniaturas se sirven como URLs públicas (assets/backend/imagenes)
  version: 1.0.0
  contact:
    name: Soporte
    email: soporte@example.com

servers:
  - url: http://localhost:3000
    description: Servidor local

tags:
  - name: Health
    description: Endpoints de verificación del servidor
  - name: Categories
    description: Gestión de categorías y subcategorías
  - name: Videos
    description: Gestión de videos con upload de archivos

paths:
  /health:
    get:
      tags:
        - Health
      summary: Verificar estado del servidor
      description: Retorna el estado actual del servidor
      operationId: getHealth
      responses:
        '200':
          description: Servidor funcionando correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/categories:
    get:
      tags:
        - Categories
      summary: Listar todas las categorías
      description: |
        Retorna todas las categorías con sus subcategorías y videos relacionados.
        Si se especifica parentId, devuelve solo los hijos directos.
      operationId: getAllCategories
      parameters:
        - name: parentId
          in: query
          required: false
          description: ID de la categoría padre para filtrar hijos directos
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Lista de categorías obtenida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'

    post:
      tags:
        - Categories
      summary: Crear una categoría o subcategoría
      description: |
        Crea una nueva categoría (principal) o subcategoría.
        El nombre se convierte a minúsculas automáticamente.
        Evita duplicados (nombres únicos globalmente).
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
            example:
              name: JavaScript
              parentId: null
      responses:
        '201':
          description: Categoría creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
              example:
                success: true
                data:
                  id: 5
                  name: javascript
                  parentId: null
        '400':
          description: El nombre está vacío
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error: El nombre no puede estar vacío
        '404':
          description: Categoría padre no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error: Categoría padre no encontrada
        '409':
          description: La categoría ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error: La categoría 'react' ya existe

  /api/categories/{id}:
    delete:
      tags:
        - Categories
      summary: Eliminar una categoría
      description: Elimina una categoría por su ID. No se puede eliminar si tiene subcategorías o videos asociados.
      operationId: deleteCategory
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la categoría a eliminar
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Categoría eliminada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Categoría eliminada exitosamente
        '400':
          description: No se puede eliminar (tiene subcategorías o videos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tieneSubcategorias:
                  value:
                    success: false
                    error: Cannot delete category with subcategories
                tieneVideos:
                  value:
                    success: false
                    error: Cannot delete category with videos
        '404':
          $ref: '#/components/responses/CategoryNotFound'

  /api/videos:
    get:
      tags:
        - Videos
      summary: Listar todos los videos
      description: |
        Retorna todos los videos, opcionalmente filtrados por categoría o búsqueda.
        Cuando se usa search, devuelve solo id y title para autocompletado.
      operationId: getAllVideos
      parameters:
        - name: categoryId
          in: query
          required: false
          description: Filtrar videos por categoría (subcategoría)
          schema:
            type: integer
            example: 2
        - name: search
          in: query
          required: false
          description: Buscar videos por título, categoría o subcategoría (devuelve solo id y title)
          schema:
            type: string
            example: react
      responses:
        '200':
          description: Lista de videos obtenida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Video'

    post:
      tags:
        - Videos
      summary: Crear un video con archivos
      description: |
        Crea un nuevo video subiendo archivos de video e imagen.
        Usa multipart/form-data.
        El título y descripción son obligatorios.
      operationId: createVideo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - titulo
                - descripcion
                - categoria
                - subCategoria
                - video
                - miniatura
              properties:
                titulo:
                  type: string
                  description: Título del video
                  example: Tutorial useState
                descripcion:
                  type: string
                  description: Descripción del video
                  example: Aprende a usar useState en React
                categoria:
                  type: string
                  description: ID de la categoría principal
                  example: "1"
                subCategoria:
                  type: string
                  description: ID de la subcategoría
                  example: "2"
                video:
                  type: string
                  format: binary
                  description: Archivo de video (mp4, webm, etc.)
                miniatura:
                  type: string
                  format: binary
                  description: Archivo de imagen para miniatura (jpg, png)
      responses:
        '201':
          description: Video creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResponse'
              example:
                success: true
                data:
                  id: 1
                  title: Tutorial useState
                  description: Aprende a usar useState en React
                  category: react
                  subCategory: hooks
                  videoUrl: http://localhost:3000/videos/tutorial_usestate.mp4
                  thumbnailUrl: http://localhost:3000/imagenes/tutorial_usestate.jpg
                  createdAt: 2026-05-08T12:00:00.000Z
        '400':
          description: Error en los datos enviados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                camposFaltantes:
                  value:
                    success: false
                    error: Todos los campos son requeridos
                archivosFaltantes:
                  value:
                    success: false
                    error: El video y la miniatura son obligatorios
                idInvalido:
                  value:
                    success: false
                    error: El ID de subcategoría debe ser un número válido
        '404':
          description: Categoría o subcategoría no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                subcategoriaNoEncontrada:
                  value:
                    success: false
                    error: Subcategoría no encontrada
                categoriaNoEncontrada:
                  value:
                    success: false
                    error: Categoría no encontrada

  /api/videos/latest:
    get:
      tags:
        - Videos
      summary: Obtener el video más reciente
      description: Retorna el video más reciente creado
      operationId: getLatestVideo
      responses:
        '200':
          description: Video más reciente obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResponse'
              example:
                success: true
                data:
                  id: 1
                  title: Tutorial useState
                  description: Aprende a usar useState en React
                  category: react
                  subCategory: hooks
                  videoUrl: http://localhost:3000/videos/tutorial_usestate.mp4
                  thumbnailUrl: http://localhost:3000/imagenes/tutorial_usestate.jpg
                  createdAt: 2026-05-08T12:00:00.000Z
        '404':
          description: No hay videos disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error: No hay videos disponibles

  /api/videos/{id}:
    get:
      tags:
        - Videos
      summary: Obtener un video por ID
      description: Retorna un video específico por su ID
      operationId: getVideoById
      parameters:
        - name: id
          in: path
          required: true
          description: ID del video a obtener
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Video obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResponse'
              example:
                success: true
                data:
                  id: 1
                  title: Tutorial useState
                  description: Aprende a usar useState en React
                  category: react
                  subCategory: hooks
                  videoUrl: http://localhost:3000/videos/tutorial_usestate.mp4
                  thumbnailUrl: http://localhost:3000/imagenes/tutorial_usestate.jpg
                  createdAt: 2026-05-08T12:00:00.000Z
        '404':
          description: Video no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error: Video not found
    delete:
      tags:
        - Videos
      summary: Eliminar un video
      description: Elimina un video por su ID y los archivos asociados
      operationId: deleteVideo
      parameters:
        - name: id
          in: path
          required: true
          description: ID del video a eliminar
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Video eliminado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Video eliminado exitosamente
        '404':
          description: Video no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error: Recurso no disponible no se encontro el video para eliminarlo

components:
  schemas:
    Category:
      type: object
      description: Modelo de categoría con relaciones recursivas
      properties:
        id:
          type: integer
          description: ID único de la categoría
          example: 1
        name:
          type: string
          description: Nombre de la categoría (siempre en minúsculas)
          example: react
        parentId:
          type: integer
          nullable: true
          description: ID de la categoría padre (null si es categoría principal)
          example: null
        parent:
          $ref: '#/components/schemas/Category'
        children:
          type: array
          items:
            $ref: '#/components/schemas/Category'
          description: Subcategorías de esta categoría
        videos:
          type: array
          items:
            $ref: '#/components/schemas/Video'
          description: Videos asociados a esta categoría

    CreateCategoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Nombre de la categoría (se convertirá a minúsculas)
          example: React
        parentId:
          type: integer
          nullable: true
          description: ID de la categoría padre (para crear subcategorías)
          example: 1

    CategoryResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Category'

    Video:
      type: object
      description: Modelo de video
      properties:
        id:
          type: integer
          description: ID único del video
          example: 1
        title:
          type: string
          description: Título del video
          example: Tutorial useState
        description:
          type: string
          description: Descripción del video
          example: Aprende a usar useState en React
        category:
          type: string
          description: Nombre de la categoría principal (padre)
          example: react
        subCategory:
          type: string
          description: Nombre de la subcategoría
          example: hooks
        videoUrl:
          type: string
          description: URL pública del archivo de video
          example: http://localhost:3000/videos/tutorial_usestate.mp4
        thumbnailUrl:
          type: string
          description: URL pública de la miniatura
          example: http://localhost:3000/imagenes/tutorial_usestate.jpg
        createdAt:
          type: string
          format: date-time
          description: Fecha de creación del video
          example: 2026-05-08T12:00:00.000Z

    VideoResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Video'

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Mensaje de error
          example: La categoría 'react' ya existe

  responses:
    BadRequest:
      description: Solicitud incorrecta
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    CategoryNotFound:
      description: Categoría no encontrada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: Recurso no disponible, no se encontró la categoría

    Conflict:
      description: Conflicto de datos (categoría duplicada)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
